name: mongo-sharding-repl

services:
  #сервер конфигурации
  configSrv:
    image: mongo:latest # docker образ
    container_name: configSrv 
    restart: always
    ports:
      - "27018:27018"
    networks:
      app-network:
        ipv4_address: 173.17.0.18
    volumes:
      - config-data:/data/db
    command:
      [
        "--configsvr",  #запуск в режиме конфигурации
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27018"
      ] 
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  #1-й шард 
  shard1_1:
    image: mongo:latest
    container_name: shard1_1
    restart: always
    ports:
      - "27011:27011"
    networks:
      app-network:
#        ipv4_address: 173.17.0.19
    volumes:
      - shard1_1-data:/data/db
    command:
      [
        "--shardsvr",     #запуск в режиме шардинга
        "--replSet",
        "shard1",         #название реплики
        "--bind_ip_all",
        "--port",
        "27011"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s
  shard1_2:
    image: mongo:latest
    container_name: shard1_2
    restart: always
    ports:
      - "27021:27021"
    networks:
      app-network:
#        ipv4_address: 173.17.0.19
    volumes:
      - shard1_2-data:/data/db
    command:
      [
        "--shardsvr",     #запуск в режиме шардинга
        "--replSet",
        "shard1",         #название реплики
        "--bind_ip_all",
        "--port",
        "27021"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s
  shard1_3:
    image: mongo:latest
    container_name: shard1_3
    restart: always
    ports:
      - "27031:27031"
    networks:
      app-network:
#        ipv4_address: 173.17.0.19
    volumes:
      - shard1_3-data:/data/db
    command:
      [
        "--shardsvr",     #запуск в режиме шардинга
        "--replSet",
        "shard1",         #название реплики
        "--bind_ip_all",
        "--port",
        "27031"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s
  #2-й шард 
  shard2_1:
    image: mongo:latest
    container_name: shard2_1
    restart: always
    ports:
      - "27012:27012"
    networks:
      app-network:
#        ipv4_address: 173.17.0.20
    volumes:
      - shard2_1-data:/data/db
    command:
      [
        "--shardsvr",     #запуск в режиме шардинга
        "--replSet",
        "shard2",         #название реплики, обратите внимание - она отличается от реплики 1-го шарда
        "--bind_ip_all", 
        "--port",
        "27012"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s
  shard2_2:
    image: mongo:latest
    container_name: shard2_2
    restart: always
    ports:
      - "27022:27022"
    networks:
      app-network:
#        ipv4_address: 173.17.0.20
    volumes:
      - shard2_2-data:/data/db
    command:
      [
        "--shardsvr",     #запуск в режиме шардинга
        "--replSet",
        "shard2",         #название реплики, обратите внимание - она отличается от реплики 1-го шарда
        "--bind_ip_all", 
        "--port",
        "27022"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s
  shard2_3:
    image: mongo:latest
    container_name: shard2_3
    restart: always
    ports:
      - "27032:27032"
    networks:
      app-network:
#        ipv4_address: 173.17.0.20
    volumes:
      - shard2_3-data:/data/db
    command:
      [
        "--shardsvr",     #запуск в режиме шардинга
        "--replSet",
        "shard2",         #название реплики, обратите внимание - она отличается от реплики 1-го шарда
        "--bind_ip_all", 
        "--port",
        "27032"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s
  
  #роутер
  router:
    image: mongo:latest
    container_name: router
    restart: always
    ports:
      - "27017:27017"
    networks:
      app-network:
        ipv4_address: 173.17.0.17
    command:
      [
        "mongos", #обычная mongo в режиме роутера
        "--configdb", 
        "config_server/configSrv:27018", #передача данных сервера конфигурации
        "--bind_ip_all",
        "--port",
        "27017"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    image: kazhem/pymongo_api:1.0.0
    depends_on:
      - router
    ports:
      - 8090:8080
    networks:
      app-network:
    environment:
      MONGODB_URL: "mongodb://router"
      MONGODB_DATABASE_NAME: "somedb"

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 173.17.0.0/16

volumes:
  config-data:
  shard1_1-data:
  shard1_2-data:
  shard1_3-data:
  shard2_1-data:
  shard2_2-data:
  shard2_3-data: